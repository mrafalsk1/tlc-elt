name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token do workflow fica só com leitura: nenhum job escreve no repositório.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variáveis exigidas por scripts/check_env.py (mesmos nomes de .env.example).
    env:
      CI: "true"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_HOST_LOCAL: localhost
      WAREHOUSE_PORT_LOCAL: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      # Único portão: check-env + lint + test + bootstrap do banco + dbt build.
      - name: Build (make validate)
        run: make validate

      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --target ci

  # Terraform: fmt + validate, sem credencial da AWS e sem apply (D-09).
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Init (sem backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate
