name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install --quiet dbt-postgres==1.8.2 ruff

      - name: Lint
        run: ruff check scripts dags

      - name: Create warehouse and empty raw schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE warehouse;"
          psql -h localhost -U postgres -d warehouse -f infra/ci_bootstrap.sql

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir . --target ci

      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --target ci
